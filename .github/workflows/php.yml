name: Validate push
on: [pull_request]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        phpunit-version: ['12', '13']

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: pcov.directory=.
          coverage: pcov
          tools: composer

      - name: Setup flex
        run: |
          composer global require --no-progress --no-scripts --no-plugins symfony/flex && composer global config --no-plugins allow-plugins.symfony/flex true

      - name: Install
        run: |
          COMPOSER_NO_SECURITY_BLOCKING=1 composer update --no-interaction --no-scripts --ansi --no-progress --prefer-dist --with "phpunit/phpunit:^${{ matrix.phpunit-version }}"

  phpstan:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        phpunit-version: ['12', '13']

    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: pcov.directory=.
          coverage: pcov
          tools: composer

      - name: PHPStan
        run: |
          vendor/bin/phpstan --ansi --no-progress

  php-cs-fixer:
    strategy:
      matrix:
        include:
          - php-version: '8.5'
            phpunit-version: '13'

    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: pcov.directory=.
          coverage: pcov
          tools: composer

      - name: PHP-CS-Fixer
        run: |
          vendor/bin/php-cs-fixer fix --config ./.php-cs-fixer.dist.php --dry-run --diff --ansi --show-progress none

  test:
    concurrency:
      group: ${{ github.head_ref ||  github.ref }}-php${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        phpunit-version: ['12', '13']

    runs-on: ubuntu-latest
    needs:
      - phpstan
      - php-cs-fixer

    steps:
      - uses: actions/checkout@v4

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ matrix.php-version }}-phpunit${{ matrix.phpunit-version }}

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: pcov.directory=.
          coverage: pcov
          tools: composer

      - name: PHPUnit
        run: |
          vendor/bin/phpunit --coverage-cobertura artifacts/code-coverage-cobertura.xml
